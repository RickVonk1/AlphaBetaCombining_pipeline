## downloaded from: https://github.com/haddocking/haddock3/tree/main/examples/refine-complex 

#====================================================================
# Refinment of a complex example

# directory in which the scoring will be done
run_dir = "$dir"

# execution mode
mode = "local"
ncores = 18


molecules = [
    "$Case"
]
# ====================================================================
# Parameters for each stage are defined below, prefer full paths
# ====================================================================
[topoaa]


[mdref]
sampling_factor = 1
tolerance = 99
dihedrals_on = True
ssdihed = 'all'
cmtight = False
cmrest = True
contactairs = True


[prodigyprotein]


[caprieval]


# ====================================================================

